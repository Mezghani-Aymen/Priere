<div class="app-wrapper" [ngClass]="{ 'theme-default': true }">
  <header class="app-header">
    <div class="header-icon">🕌</div>
    <h1 [ngStyle]="{ 'color': '#1e3a47', 'letter-spacing': '1px' }">HORAIRES DE PRIÈRE</h1>
    <p class="subtitle" [ngStyle]="{ 'color': '#666666' }">Application Prières</p>
  </header>

  <nav class="app-nav" [ngClass]="{ 'nav-shadow': true }">
    <a
      [routerLink]="['/search']"
      routerLinkActive="active"
      class="nav-tab"
    >
      🏙️ Par Ville
    </a>
    <a
      [routerLink]="['/location']"
      routerLinkActive="active"
      class="nav-tab"
    >
      📍 Ma Position
    </a>
  </nav>

  <main class="app-content">
    <router-outlet />
  </main>
</div>
