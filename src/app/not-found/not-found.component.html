<div class="not-found-wrapper">
  <div
    class="not-found-card"
    [ngClass]="{ 'shadow-card': true }"
  >
    <div
      class="badge-404"
    >
      Erreur 404
    </div>
    <div class="not-found-icon">🧭</div>
    <h2>Page Non Trouvée</h2>
    <p class="not-found-desc">
      Oups ! La page que vous essayez d'atteindre n'existe pas ou a été déplacée.
    </p>


    <div class="hint-text">
      <span>Besoin d'aide ? Utilisez la navigation ci-dessus pour consulter les horaires de prière.</span>
    </div>
  </div>
</div>
